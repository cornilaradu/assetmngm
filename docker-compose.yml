version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset_maintenance
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/asset_maintenance?schema=public"
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:5173"
      JWT_SECRET: "schimba-acest-secret-cu-unul-lung-si-random"
      JWT_EXPIRES_IN: "8h"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      REMINDER_CRON_SCHEDULE: "0 7 * * *"
      DEFAULT_REMINDER_DAYS_BEFORE: 7
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:4000/api"
    ports:
      - "5173:5173"

volumes:
  db_data:
